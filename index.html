<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر قدم‌ها</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0a0c;--card:#17171c;--ink:#f4f4f0;--sub:#9a9aa3;--lime:#c6ff00;--hot:#ff4d1a;--line:#2a2a32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif;line-height:1.7;min-height:100vh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--lime);padding-bottom:8px;margin-bottom:14px}
h1{font-size:30px;font-weight:900;font-style:italic;margin:0}
h1 span{color:var(--lime)}
.rate{background:var(--hot);color:#fff;font-weight:900;font-size:13px;padding:3px 10px;border-radius:4px;transform:skewX(-10deg)}
.wallet{background:var(--card);border:1px solid var(--line);border-right:6px solid var(--lime);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.wallet b{color:var(--lime);font-size:24px}
.money{font-size:78px;font-weight:900;font-style:italic;color:var(--lime);text-align:center;line-height:1.1;margin:8px 0 0;text-shadow:0 0 24px rgba(198,255,0,.35)}
.lbl{text-align:center;color:var(--sub);font-size:14px}
.grid{display:flex;gap:8px;margin:14px 0}
.grid div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:center;padding:8px 4px}
.grid b{display:block;font-size:22px;font-weight:900}
.grid small{color:var(--sub)}
.bar{height:10px;background:var(--card);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hot),var(--lime));transition:width .4s}
.msg{min-height:104px;background:var(--card);border-right:6px solid var(--hot);border-radius:8px;padding:12px 14px;font-size:18px;margin-bottom:14px}
.msg small{display:block;color:var(--hot);font-weight:900;margin-bottom:2px}
button{font:inherit;cursor:pointer}
.go{width:100%;padding:18px;font-size:24px;font-weight:900;font-style:italic;border:0;border-radius:8px;background:var(--lime);color:#000;letter-spacing:1px}
.go:disabled{opacity:.5}
.go.stop{background:var(--hot);color:#fff}
.go:focus-visible,.mood button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.note{color:var(--sub);font-size:13px;text-align:center;min-height:22px;margin-top:6px}
.mood{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:14px;text-align:center}
.mood.show{display:block}
.mood button{margin:4px;padding:10px 14px;border-radius:8px;border:2px solid var(--lime);background:transparent;color:var(--ink);font-size:16px;font-weight:700}
h2{font-size:16px;margin:24px 0 6px;color:var(--lime);font-style:italic}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;z-index:10;padding:24px}
.ov.show{display:flex}
#count{background:rgba(0,0,0,.92)}
#cnum{font-size:150px;font-weight:900;font-style:italic;color:var(--lime);line-height:1}
#cheer{background:radial-gradient(circle,#ff4d1a 0,#7a1d00 100%);pointer-events:none}
#cheer .big{font-size:64px;font-weight:900;font-style:italic;color:#fff}
#cheer .usd{font-size:44px;font-weight:900;color:var(--lime);direction:ltr}
#calm{background:#000;z-index:20}
#calmtxt{font-size:26px;line-height:2;color:#8fa05a;max-width:420px}
#calmhint{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));color:#3d4528;font-size:13px}
</style>
</head>
<body>
<main>
<div class="top"><h1>دفتر <span>قدم‌ها</span></h1><div class="rate">هر قدم = ۱$</div></div>

<div class="wallet"><span>دارایی خیالی تو</span><b dir="ltr" id="bank">$0</b></div>

<div class="money" dir="ltr" id="usd">$0</div>
<div class="lbl">ارزش این پیاده‌روی</div>

<div class="grid">
<div><b id="m">۰</b><small>متر</small></div>
<div><b id="t">۰:۰۰</b><small>زمان</small></div>
<div><b id="nx">۲۰۰</b><small>تا جایزه‌ی بعد (متر)</small></div>
</div>
<div class="bar"><i id="bar"></i></div>

<div class="msg" id="msg"><small>پیام مسیر</small>شروع را بزن. هر ۲۰۰ متر، ۲۰۰ دلار جایزه و یک تشویق بزرگ!</div>

<button class="go" id="go">شروع!</button>
<div class="note" id="note"></div>

<div class="mood" id="mood">
<div id="summary" style="margin-bottom:8px"></div>
<div>حالت بعد از پیاده‌روی چطور شد؟</div>
<button data-m="بهتر شدم">بهتر شدم 😊</button>
<button data-m="مثل قبل">مثل قبل 😐</button>
<button data-m="هنوز نه">هنوز نه 😔</button>
</div>

<h2>پیاده‌روی‌های قبلی</h2>
<ul class="hist" id="hist"></ul>
</main>

<div class="ov" id="count"><div id="cnum"></div></div>
<div class="ov" id="cheer"><div class="big">ماشاالله! 🔥</div><div class="usd" id="cusd"></div></div>
<div class="ov" id="calm"><div id="calmtxt"></div><div id="calmhint">برای برگشتن، صفحه را لمس کن</div></div>

<script>
(function(){
var MSGS=[
"دویست متر رفتی و زیباتر شدی. تو به طبیعت نیامدی، طبیعت به پیش تو آمد.",
"نفس عمیق بکش. هوا رایگان است و گران‌بهاترین چیز دنیاست.",
"هر قدمت یک دلار ارزش دارد. تو روی طلا راه می‌روی.",
"زیبایی دیدی؟ همین الان چشمت یک چیز قشنگ پیدا کرده. نگاهش کن.",
"همه‌ی زیورآلات و جواهرات از دل همین زمین آمده‌اند. تو داری از میان گنج‌ها رد می‌شوی.",
"ماشین‌ها و ساختمان‌های لوکس هم از خاک همین طبیعت ساخته شده‌اند. تو کنار سرچشمه‌ی همه‌ی آن‌هایی.",
"قوی باش و ادامه بده. ذهنت دارد صاف می‌شود.",
"ایده‌های بزرگ در همین قدم‌ها به دنیا می‌آیند. اگر ایده‌ای آمد، یادش نگه دار.",
"امروز تو از دیروزت ثروتمندتری، هم در جیب و هم در جان.",
"پای تو دارد راه ثروت و آرامشت را روی زمین می‌کشد."];
var CALM=[
"تصور کن با همین سرعت داری مسیر موفقیت را پیش می‌بری.",
"چرا ساختن سخته ولی خراب کردن راحته؟<br>با هر قدم جوابش را بساز.",
"B",
"هر قدم یک دلار ارزش دارد. تو داری ثروتمند می‌شوی.",
"بزرگ‌ترین رقیب تو، خودِ دیروزت است. ازش جلو بزن.",
"چشمت به آینده، پایت در امروز.",
"B"];
var STEP=200,IDLE=20000;
var $=function(i){return document.getElementById(i)};
var fa=function(n){return Number(n).toLocaleString('fa-IR')};
var S={usd:0,hist:[]};
try{var raw=localStorage.getItem('daftar2');if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem('daftar2',JSON.stringify(S))}catch(e){}}

var AC;
function ac(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function hooray(){var a=ac();if(!a)return;var t=a.currentTime,L=2.4,n=Math.floor(a.sampleRate*L),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
for(var i=0;i<n;i++)d[i]=Math.random()*2-1;
var s=a.createBufferSource();s.buffer=b;
var f=a.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1700,t+1);f.Q.value=.6;
var g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.7,t+.35);g.gain.setValueAtTime(.7,t+1.3);g.gain.linearRampToValueAtTime(.0001,t+L);
s.connect(f);f.connect(g);g.connect(a.destination);s.start(t);
[220,277,330,440].forEach(function(fr){var o=a.createOscillator(),og=a.createGain(),lp=a.createBiquadFilter();
o.type='sawtooth';o.frequency.setValueAtTime(fr*.8,t);o.frequency.linearRampToValueAtTime(fr*1.25,t+.9);o.frequency.linearRampToValueAtTime(fr,t+L);
lp.type='lowpass';lp.frequency.value=1400;
og.gain.setValueAtTime(.0001,t);og.gain.linearRampToValueAtTime(.07,t+.4);og.gain.linearRampToValueAtTime(.0001,t+L);
o.connect(lp);lp.connect(og);og.connect(a.destination);o.start(t);o.stop(t+L)})}
function say(txt){try{var u=new SpeechSynthesisUtterance(txt),vs=speechSynthesis.getVoices(),
v=vs.filter(function(x){return /^fa/i.test(x.lang)})[0]||vs.filter(function(x){return /^ar/i.test(x.lang)})[0];
if(v){u.voice=v;u.lang=v.lang}else u.lang='fa-IR';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

var watching=null,last=null,dist=0,mile=0,t0=0,timer=null,lock=null,lastTouch=Date.now(),calmOn=false,calmIdx=0,calmT=0,calmDur=0,busy=false;

function meters(a,b){var R=6371000,r=Math.PI/180,dLa=(b.latitude-a.latitude)*r,dLo=(b.longitude-a.longitude)*r,
x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.latitude*r)*Math.cos(b.latitude*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
return 2*R*Math.asin(Math.sqrt(x))}

function render(){
var m=Math.floor(dist);
$('bank').textContent='$'+fa(S.usd);
$('usd').textContent='$'+fa(m);
$('m').textContent=fa(m);
$('nx').textContent=fa(STEP-(m%STEP));
$('bar').style.width=((m%STEP)/STEP*100)+'%';
var ul=$('hist');ul.innerHTML='';
if(!S.hist.length){ul.innerHTML='<li><span>هنوز چیزی ثبت نشده</span></li>';return}
S.hist.slice(0,8).forEach(function(h){var li=document.createElement('li');
li.innerHTML='<span>'+h.d+' — '+fa(h.m)+' متر، <span dir="ltr">$'+fa(h.m)+'</span></span><span>'+(h.mood||'')+'</span>';ul.appendChild(li)})}

function tick(){var s=Math.floor((Date.now()-t0)/1000),r=s%60;$('t').textContent=fa(Math.floor(s/60))+':'+(r<10?'۰':'')+fa(r)}

function celebrate(n){
var usd=n*STEP;
$('cusd').textContent='+$'+fa(usd);$('cheer').classList.add('show');
hooray();say('ماشاالله');
vib([120,60,120,60,120,60,300,100,500]);
setTimeout(function(){$('cheer').classList.remove('show')},2400);
$('msg').innerHTML='<small>'+fa(n*STEP)+' متر! +$'+fa(STEP)+'</small>'+MSGS[(n-1)%MSGS.length];
S.usd+=STEP;save();lastTouch=Date.now()}

function onPos(p){var c=p.coords;
if(c.accuracy>40){$('note').textContent='در حال گرفتن سیگنال GPS دقیق...';return}
$('note').textContent='';
if(last){var d=meters(last,c);if(d>3&&d<100){dist+=d;last=c}}else last=c;
var n=Math.floor(dist/STEP);
while(mile<n){mile++;celebrate(mile)}
render()}
function onErr(e){$('note').textContent=e.code===1?'اجازه‌ی دسترسی به مکان را بده.':'GPS در دسترس نیست. بیرون از ساختمان امتحان کن.'}

function start(){
if(!navigator.geolocation){$('note').textContent='این مرورگر GPS ندارد.';return}
ac();busy=true;$('go').disabled=true;$('mood').classList.remove('show');
var seq=[['۱','یک',440],['۲','دو',440],['۳','سه',440],['شروع!','شروع',880]],i=0;
$('count').classList.add('show');
(function step(){
if(i<4){$('cnum').textContent=seq[i][0];beep(seq[i][2],i==3?.5:.25);say(seq[i][1]);i++;setTimeout(step,i==4?750:900)}
else{$('count').classList.remove('show');vib(50);begin()}})()}

async function begin(){
dist=0;mile=0;last=null;t0=Date.now();lastTouch=Date.now();
$('go').textContent='پایان';$('go').classList.add('stop');$('go').disabled=false;
$('msg').innerHTML='<small>پیام مسیر</small>برو! هر ۲۰۰ متر یک جشن!';
timer=setInterval(function(){tick();calmCheck()},1000);tick();
watching=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000});
try{if(navigator.wakeLock)lock=await navigator.wakeLock.request('screen')}catch(e){}
render()}

function stop(){
navigator.geolocation.clearWatch(watching);watching=null;clearInterval(timer);busy=false;hideCalm();
try{if(lock)lock.release()}catch(e){}
$('go').textContent='شروع!';$('go').classList.remove('stop');
var rec={d:new Date().toLocaleDateString('fa-IR'),m:Math.floor(dist),mood:''};
S.hist.unshift(rec);save();
$('summary').innerHTML='آفرین! <b>'+fa(rec.m)+' متر</b>، ارزش خیالی: <b dir="ltr">$'+fa(rec.m)+'</b>';
$('mood').classList.add('show');render()}

function showCalm(){calmOn=true;calmIdx=Math.floor(Math.random()*CALM.length);calmT=0;calmDur=0;$('calm').classList.add('show');calmStep()}
function hideCalm(){calmOn=false;$('calm').classList.remove('show');lastTouch=Date.now()}
function calmStep(){
var it=CALM[calmIdx];
if(it==='B'){var s=calmT%10;
$('calmtxt').innerHTML=s<4?'تنفس شکمی<br>دم آرام از شکم...<br><b style="font-size:48px">'+fa(s+1)+'</b>':'بازدم آرام و بلند...<br><b style="font-size:48px">'+fa(s-3)+'</b>';
if(!calmDur)calmDur=30}
else{if(!calmDur){$('calmtxt').innerHTML=it;calmDur=14}}
calmT++;
if(calmT>=calmDur){calmIdx=(calmIdx+1)%CALM.length;calmT=0;calmDur=0}}
function calmCheck(){
if(calmOn){calmStep();return}
if(watching!==null&&Date.now()-lastTouch>IDLE)showCalm()}
['touchstart','pointerdown'].forEach(function(ev){document.addEventListener(ev,function(){lastTouch=Date.now()},{passive:true})});
$('calm').addEventListener('click',hideCalm);

$('go').addEventListener('click',function(){if(busy&&watching===null)return;watching===null?start():stop()});
Array.prototype.forEach.call(document.querySelectorAll('.mood button'),function(b){b.addEventListener('click',function(){
if(S.hist.length){S.hist[0].mood=b.getAttribute('data-m');save()}
$('summary').textContent=b.getAttribute('data-m')==='بهتر شدم'?'عالی! این حس را به یاد بسپار.':'اشکالی ندارد. فردا دوباره، قدم به قدم.';render()})});
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
</body>
</html>
